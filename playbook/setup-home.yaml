---
- name: Home workstation setup
  hosts: home
  gather_facts: true

  roles:
    # RPM Fusion free + nonfree (nvidia) must come before fedora_dependencies:
    # steam is installed from rpmfusion-nonfree-steam
    - role: rpmfusion
      become: true
      tags: [rpm]
    - role: nvidia
      become: true
      tags: [nvidia]
    - role: fedora_dependencies
      become: true
      tags: [fedora_dependencies]
    - role: hostname
      become: true
      tags: [hostname]
    - role: data_disk
      become: true
      tags: [data_disk]
    - role: mise
      tags: [mise]
    - role: jaredhocutt.gnome_extensions
      tags: [gnome_extensions]
    - role: ssh_config
      tags: [ssh_config]
    - role: git_config
      tags: [git_config]
    - role: zellij
      tags: [zellij]
    - role: commons
      tags: [commons]
    - role: generic_app
      vars:
        generic_app_name: "pangolin"
        # renovate: datasource=github-releases depName=fosrl/cli
        generic_app_url: "https://github.com/fosrl/cli/releases/download/0.18.0/pangolin-cli_linux_amd64"
        generic_app_folder: "{{ ansible_facts['env']['HOME'] }}/.local/bin"
        generic_app_icon: "{{ ansible_facts['env']['HOME'] }}/dotfiles/assets/pangolin.jpg"
        generic_app_autostart: "true"
        generic_app_categories: "Network;"
      tags: [pangolin]
    - role: kdrive
      vars:
        kdrive_remove_legacy_install: true
      tags: [kdrive]
    - role: generic_app
      vars:
        generic_app_name: "ledger"
        # renovate: datasource=github-releases depName=LedgerHQ/ledger-live extractVersion=^@ledgerhq/live-desktop@(?<version>.+)$
        generic_app_url: "https://download.live.ledger.com/ledger-live-desktop-4.24.1-linux-x86_64.AppImage"
        generic_app_folder: "/opt/ledger"
        generic_app_icon: "{{ ansible_facts['env']['HOME'] }}/dotfiles/assets/ledger.svg"
        generic_app_autostart: "false"
        generic_app_categories: "Finance;"
      tags: [ledger]
    - role: generic_app
      vars:
        generic_app_name: "obsidian"
        # renovate: datasource=github-releases depName=obsidianmd/obsidian-releases
        generic_app_url: "https://github.com/obsidianmd/obsidian-releases/releases/download/v1.13.7/Obsidian-1.13.7.AppImage"
        generic_app_folder: "{{ ansible_facts['env']['HOME'] }}/.local/bin"
        generic_app_icon: "{{ ansible_facts['env']['HOME'] }}/dotfiles/assets/obsidian.png"
        generic_app_autostart: "false"
        generic_app_categories: "Productivity;"
      tags: [obsidian]
    - role: obsidian_config
      tags: [obsidian]
    - role: generic_app
      vars:
        generic_app_name: "github-copilot"
        # renovate: datasource=github-releases depName=github/app
        generic_app_url: "https://github.com/github/app/releases/download/v1.1.30/GitHub-Copilot-linux-x64.AppImage"
        generic_app_folder: "{{ ansible_facts['env']['HOME'] }}/.local/bin"
        generic_app_icon: "{{ ansible_facts['env']['HOME'] }}/dotfiles/assets/github-copilot.svg"
        generic_app_autostart: "false"
        generic_app_categories: "Development;"
      tags: [github-copilot]
    # Unversioned URL (redirects to the latest build): no Renovate comment, the launcher updates itself
    - role: generic_app
      vars:
        generic_app_name: "epic-games-launcher"
        generic_app_url: >-
          https://launcher-public-service-prod06.ol.epicgames.com/launcher/api/installer/download/EpicGamesLauncher-x86_64.AppImage
        generic_app_folder: "{{ ansible_facts['env']['HOME'] }}/.local/bin"
        generic_app_icon: "{{ ansible_facts['env']['HOME'] }}/dotfiles/assets/epic-games-launcher.png"
        generic_app_autostart: "false"
        generic_app_categories: "Game;"
      tags: [epic-games-launcher]
    - role: gnome
      tags: [gnome]
