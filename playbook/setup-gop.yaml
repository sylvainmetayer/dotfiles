---
- name: GOP workstation setup
  hosts: gop
  gather_facts: true

  roles:
    - role: fedora_dependencies
      become: true
      tags: [fedora_dependencies]
    - role: mise
      tags: [mise]
    - role: rpmfusion
      become: true
      tags: [rpm]
    - role: jaredhocutt.gnome_extensions
      tags: [gnome_extensions]
    - role: ssh_config
      tags: [ssh_config]
    - role: git_config
      tags: [git_config]
    - role: kdrive
      vars:
        kdrive_remove_legacy_install: true
      tags: [kdrive]
    - role: generic_app
      vars:
        generic_app_name: "obsidian"
        # renovate: datasource=github-releases depName=obsidianmd/obsidian-releases
        generic_app_url: "https://github.com/obsidianmd/obsidian-releases/releases/download/v1.13.7/Obsidian-1.13.7.AppImage"
        generic_app_folder: "{{ ansible_facts['env']['HOME'] }}/.local/bin"
        generic_app_icon: "{{ ansible_facts['env']['HOME'] }}/dotfiles/assets/obsidian.png"
        generic_app_autostart: "false"
        generic_app_categories: "Productivity;"
      tags: [obsidian]
    - role: jetbrains_toolbox
      tags: [jetbrains_toolbox]
    - role: gnome
      tags: [gnome]
    - role: xremap
      tags: [xremap]
    - role: commons
      tags: [commons]
    - role: gop
      tags: [gop]
    - role: git_credential_keepassxc
      tags: [git_credential_keepassxc]
