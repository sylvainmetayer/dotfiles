---
name: Ansible Lint

on:
  # Sans filtre de chemins : « lint » est requis par le ruleset de main, et un
  # check requis qui ne tourne pas bloque la PR.
  pull_request:
  push:
    branches:
      - main
      - rework

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}

      # Versions verrouillées par uv.lock (ansible, ansible-lint, yamllint), roues
      # uniquement : aucun script d'installation exécuté, aucune version non résolue.
      - name: Install dependencies
        run: |
          pip install --quiet --only-binary :all: uv==0.13.6
          uv sync --locked --no-build --python "$(command -v python)"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Install Galaxy roles/collections
        run: |
          if [ -f requirements.yml ]; then \
            ansible-galaxy role install -r requirements.yml; \
            ansible-galaxy collection install -r requirements.yml; \
          fi

      - name: Ansible syntax check (flattened playbooks)
        run: |
          for p in playbook/setup-*.yaml; do \
            echo "Syntax check $p"; \
            ansible-playbook "$p" --syntax-check || exit 1; \
          done

      - name: ansible-lint
        run: |
          ansible-lint -v

      - name: yamllint
        run: |
          yamllint .

      - name: Report summary
        if: always()
        run: |-
          echo "Ansible lint job completed."
