---
name: Ansible

on: [push]

permissions:
  contents: read

# Fait doublon avec le job lint (3.12) d'ansible-lint.yml (même syntax-check,
# même yamllint), mais « build (3.12) » est un check requis par le ruleset de
# main : le supprimer ou le renommer bloquerait toutes les PR. Le retirer
# d'abord du ruleset (réglages GitHub), puis supprimer ce fichier.
jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
      # Versions verrouillées par uv.lock (ansible, yamllint), roues uniquement :
      # aucun script d'installation exécuté, aucune version non résolue.
      - name: Install Ansible
        run: |
          pip install --quiet --only-binary :all: uv==0.13.6
          uv sync --locked --no-build --python "$(command -v python)"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Lint playbook
        run: |
          ansible-galaxy role install -r requirements.yml
          ansible-galaxy collection install -r requirements.yml
          ansible-playbook playbook/setup-dell.yaml --syntax-check
          ansible-playbook playbook/setup-home.yaml --syntax-check
          ansible-playbook playbook/setup-gop.yaml --syntax-check
          yamllint .
