---
name: Lint

on: [push]

permissions:
  contents: read

jobs:
  # « build » est un check requis par le ruleset de main : ne pas renommer ce job
  # ni filtrer ce workflow par chemins, sinon toutes les PR restent bloquées.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Tout le dépôt : les .sh, .bash_aliases, et les exécutables sans extension
      # à shebang shell (keepass-backup, switch-gpu).
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@00b27aa7cb85167568cb48a3838b75f4265f2bca # master
        with:
          scandir: "."
