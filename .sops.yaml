---
# Clés post-quantiques d'environ 1 960 caractères, insécables.
# yamllint disable rule:line-length
# sops creation rules: encrypted Ansible vars files (host_vars/<host>.sops.yaml).
# Destinataires age post-quantiques uniquement (age1pq1…, ML-KEM-768 + X25519,
# age >= 1.3, sops >= 3.12), les mêmes clés que le homelab : perso, pro et la
# clé de secours hors ligne. Un seul destinataire X25519 suffirait à exposer la
# clé de données. Après un changement ici : sops updatekeys <fichier>, puis
# sops rotate -i <fichier>.
# Valeurs non changées lors du passage en post-quantique (choix du 30/10/2026) :
# l'ancienne version X25519 du fichier, dans l'historique public, donne encore
# les valeurs actuelles. Les faire tourner pour qu'elles soient protégées.
creation_rules:
  - path_regex: host_vars/.*\.sops\.ya?ml$
    key_groups:
      - age:
          -  # perso
          -  # pro
          -  # secours
