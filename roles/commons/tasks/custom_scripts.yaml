---
- name: Render custom scripts Template
  ansible.builtin.set_fact:
    commons_custom_script_template: "{{ lookup('template', 'custom_scripts.sh.j2') }}"

- name: Ensure ~/.bashrc.d folder exists
  ansible.builtin.file:
    path: "~/.bashrc.d"
    state: directory
    owner: "{{ ansible_user_uid }}"
    group: "{{ ansible_user_gid }}"
    mode: "0755"

# Fedora's default ~/.bashrc already sources ~/.bashrc.d/*
- name: Source bash aliases in bashrc
  ansible.builtin.blockinfile:
    insertafter: "#!/usr/bin/env bash"
    dest: "~/.bashrc"
    block: |
      if [ -f ~/.bash_aliases ]; then
        source ~/.bash_aliases
      fi
    marker: "#{mark} ANSIBLE STARTUP SCRIPTS"

- name: Add custom scripts in bashrc
  ansible.builtin.blockinfile:
    insertafter: "EOF"
    dest: "~/.bashrc"
    block: |
      {{ commons_custom_script_template }}
    marker: "#{mark} ANSIBLE CUSTOM SCRIPTS"
