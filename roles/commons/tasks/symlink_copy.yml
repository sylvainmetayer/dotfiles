---
- name: "Ensure parent folder exists for copy {{ item }}"
  ansible.builtin.file:
    mode: "{{ commons_folder_modes[item | dirname] | default('0700') }}"
    path: "~/{{ item | dirname }}"
    state: directory

- name: "Copy dotfile {{ item }}"
  ansible.builtin.copy:
    src: "{{ role_path }}/files/{{ item }}"
    dest: ~/{{ item }}
    force: false
    group: "{{ ansible_facts['user_gid'] }}"
    owner: "{{ ansible_facts['user_uid'] }}"
    mode: "0700"
