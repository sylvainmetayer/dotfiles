---
# The release RPM is signed with the RPM Fusion key, which is not imported yet
# on a fresh install: this is the bootstrap step of https://rpmfusion.org/Configuration
- name: Install the RPM Fusion nonfree release package
  ansible.builtin.dnf:
    name: "{{ nvidia_rpmfusion_release_url }}"
    state: present
    disable_gpg_check: true

# The tainted release package has no stable URL, it is published in the nonfree
# repository installed by the previous task.
- name: Install the RPM Fusion nonfree tainted release package
  ansible.builtin.dnf:
    name:
      - rpmfusion-nonfree-release-tainted
      - fedora-workstation-repositories
    state: present

- name: Enable NVIDIA driver and Steam repositories
  community.general.ini_file:
    path: "/etc/yum.repos.d/{{ item }}.repo"
    section: "{{ item }}"
    option: enabled
    value: "1"
    no_extra_spaces: true
    create: false
    mode: "0644" # NOSONAR (fichier .repo système, lisible par dnf comme les autres dépôts)
  loop: "{{ nvidia_repositories }}"

- name: Install NVIDIA driver packages
  ansible.builtin.dnf:
    name: "{{ nvidia_packages }}"
    state: present
    update_cache: true
