---
- name: Install kdrive-auto-update dependencies
  become: true
  ansible.builtin.package:
    name: "{{ kdrive_packages }}"
    state: present

- name: Ensure kDrive folders exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ kdrive_bin_folder }}"
    - "{{ kdrive_config_folder }}"
    - "{{ kdrive_applications_folder }}"

- name: Ensure autostart folder exists
  ansible.builtin.file:
    path: "{{ kdrive_autostart_folder }}"
    state: directory
    mode: "0700"

- name: Install kdrive-auto-update script
  ansible.builtin.get_url:
    url: "https://raw.githubusercontent.com/oRiamn/kdrive-auto-update/{{ kdrive_auto_update_ref }}/kdrive-auto-update"
    dest: "{{ kdrive_bin_folder }}/kdrive-auto-update"
    mode: "0755"
    force: true

- name: Configure the architecture watched by kdrive-auto-update
  ansible.builtin.copy:
    content: "{{ kdrive_architecture }}\n"
    dest: "{{ kdrive_config_folder }}/architecture"
    mode: "0644"

# Run before rendering kDrive.desktop, so a pending update does not leave the
# Exec= line pointing at a fixed AppImage at the end of the run.
- name: Run kdrive-auto-update
  ansible.builtin.command: "{{ kdrive_bin_folder }}/kdrive-auto-update"
  register: kdrive_update
  changed_when: "'update needed' in kdrive_update.stdout"
  when: kdrive_run_update | bool

- name: Autostart kdrive-auto-update at login
  ansible.builtin.template:
    src: "kdrive-auto-update.desktop.j2"
    dest: "{{ kdrive_autostart_folder }}/kdrive-auto-update.desktop"
    mode: "0755"

# Three writers touch this file:
# - this role renders it with Exec=kdrive-launch, which resolves the newest
#   kDrive-<arch>-v*.AppImage kept by kdrive-auto-update at launch time;
# - kdrive-auto-update deletes the Exec= line and appends Exec='<new AppImage>'
#   after each update, which still starts the newest version;
# - the kDrive client itself rewrites it with its own AppImage path when
#   "launch at startup" is enabled, pinning the version that is running.
# force: true brings the wrapper back on every run.
- name: Render the kDrive autostart entry
  ansible.builtin.template:
    src: "kdrive-autostart.desktop.j2"
    dest: "{{ kdrive_autostart_folder }}/kDrive.desktop"
    mode: "0755"
    force: true

- name: Install the kDrive launcher wrapper
  ansible.builtin.template:
    src: "kdrive-launch.j2"
    dest: "{{ kdrive_bin_folder }}/kdrive-launch"
    mode: "0755"

# applications/kDrive.desktop is (re)written by the kDrive client to register
# the kdrive:// URL handler, so the menu entry uses its own file name.
- name: Create the kDrive desktop entry
  ansible.builtin.template:
    src: "kdrive.desktop.j2"
    dest: "{{ kdrive_applications_folder }}/kdrive-launch.desktop"
    mode: "0644"

- name: Remove the previous generic_app based installation
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ kdrive_legacy_paths }}"
  when: kdrive_remove_legacy_install | bool
