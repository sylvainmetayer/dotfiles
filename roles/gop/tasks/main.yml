---
- name: "Link work related script"
  ansible.builtin.file:
    src: ~/dotfiles/roles/gop/files/gop.sh
    dest: ~/.gop.sh
    state: link
    force: false

- name: "Link AWS SSM script"
  ansible.builtin.file:
    src: ~/dotfiles/roles/gop/files/aws-ssm-ec2-proxy-command.sh
    dest: ~/.ssh/aws-ssm-ec2-proxy-command.sh
    state: link
    force: false

- name: Load work script
  ansible.builtin.blockinfile:
    path: ~/.bashrc
    insertbefore: EOF
    marker: "#{mark} ANSIBLE WORK MANAGED BLOCK"
    block: |
      . $HOME/.gop.sh

- name: "Install work related packages"
  become: true
  ansible.builtin.package:
    name:
      - openfortivpn
      - NetworkManager-fortisslvpn-gnome
      - NetworkManager-fortisslvpn
      - telnet
      - onedrive
    state: present
  tags:
    - network_access

- name: Render SSH work host template
  ansible.builtin.set_fact:
    gop_ssh_work_config: "{{ lookup('template', 'ssh_hosts.j2') }}"
    gop_aws_work_config: "{{ lookup('template', 'aws_config.j2') }}"
  no_log: true

- name: Template SSH Config with work hosts
  ansible.builtin.blockinfile:
    insertbefore: BOF
    dest: "~/.ssh/config"
    block: |
      {{ gop_ssh_work_config }}
    marker: "#{mark} ANSIBLE MANAGED BLOCK WORK SSH"
  no_log: true

- name: Ensure the AWS config folder exists
  ansible.builtin.file:
    path: ~/.aws
    state: directory
    mode: "0700"

- name: Template AWS work config
  ansible.builtin.blockinfile:
    insertbefore: BOF
    dest: "~/.aws/config"
    create: true
    mode: "0600"
    block: |
      {{ gop_aws_work_config }}
    marker: "#{mark} ANSIBLE MANAGED BLOCK WORK AWS"
  no_log: true

- name: Install AWS Session Manager plugin
  block:
    - name: Create a download folder for the Session Manager plugin
      ansible.builtin.tempfile:
        state: directory
        suffix: ssm-plugin
      register: gop_ssm_plugin_tmp
      # Download and check also run under --check (temporary folder only), so a
      # dry run reports a bad signature; dnf below honours check mode.
      check_mode: false

    - name: Download the Session Manager plugin and its signature
      ansible.builtin.get_url:
        url: "{{ item.url }}"
        dest: "{{ gop_ssm_plugin_tmp.path }}/{{ item.dest }}"
        mode: "0600"
      loop:
        - { url: "{{ gop_ssm_plugin_url }}", dest: session-manager-plugin.rpm }
        - { url: "{{ gop_ssm_plugin_signature_url }}", dest: session-manager-plugin.rpm.sig }
      check_mode: false

    - name: Copy the AWS Session Manager signing key
      ansible.builtin.copy:
        src: "{{ gop_ssm_plugin_key }}"
        dest: "{{ gop_ssm_plugin_tmp.path }}/key.asc"
        mode: "0600"
      check_mode: false

    # gpgv only reads a binary keyring; its status output names the primary key
    # that made a good signature, checked against the pinned fingerprint below.
    - name: Verify the Session Manager plugin signature
      ansible.builtin.shell:
        cmd: >-
          gpg --dearmor < key.asc > key.gpg &&
          gpgv --status-fd 1 --keyring ./key.gpg session-manager-plugin.rpm.sig session-manager-plugin.rpm
        chdir: "{{ gop_ssm_plugin_tmp.path }}"
      register: gop_ssm_plugin_gpgv
      changed_when: false
      check_mode: false

    - name: Check the signing key fingerprint
      ansible.builtin.assert:
        that: gop_ssm_plugin_gpgv.stdout is regex('^\[GNUPG:\] VALIDSIG \S+ .* ' ~ gop_ssm_plugin_key_fingerprint ~ '$', multiline=True)
        fail_msg: "session-manager-plugin.rpm is not signed by {{ gop_ssm_plugin_key_fingerprint }}"
        quiet: true

    # The RPM has no embedded signature for dnf to check: its detached signature
    # was verified above, so dnf's own check is turned off for this file only.
    - name: Install the verified Session Manager plugin
      become: true
      ansible.builtin.dnf:
        disable_gpg_check: true
        name: "{{ gop_ssm_plugin_tmp.path }}/session-manager-plugin.rpm"
        state: present
  always:
    - name: Remove the Session Manager plugin download folder
      ansible.builtin.file:
        path: "{{ gop_ssm_plugin_tmp.path }}"
        state: absent
      when: gop_ssm_plugin_tmp.path is defined
      check_mode: false

- name: Copy onepoint-keepassxc.pub to .ssh folder
  ansible.builtin.copy:
    src: ./files/onepoint-keepassxc.pub
    dest: ~/.ssh/onepoint-keepassxc.pub
    group: "{{ ansible_facts['user_gid'] }}"
    owner: "{{ ansible_facts['user_uid'] }}"
    mode: "0600"
