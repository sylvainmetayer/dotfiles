---
- name: Enable mise copr
  become: true
  community.general.copr:
    host: copr.fedorainfracloud.org
    name: jdxcode/mise
    state: enabled

- name: Install mise
  become: true
  ansible.builtin.dnf:
    name: "mise"
    state: present
    update_cache: true

- name: Create mise global folder
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.config/mise"
    state: directory
    mode: "0755" # NOSONAR (config mise, sans secret)

- name: Create config mise file
  notify: Run mise install
  ansible.builtin.template:
    src: "config.toml.j2"
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/mise/config.toml"
    mode: "0644" # NOSONAR (liste d'outils et versions, sans secret)

# Installs the tools now, not at the end of the play: later roles need them on a fresh workstation
# (sops for community.sops.load_vars in keepass_backup and obsidian_config, cargo for git_credential_keepassxc).
# They reach them through the mise shims, as the running play's PATH predates the install.
- name: Run mise install before the next roles
  ansible.builtin.meta: flush_handlers
